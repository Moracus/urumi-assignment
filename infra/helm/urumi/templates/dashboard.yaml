{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: urumi-dashboard-config
data:
  runtime-config.json: {{ dict "publicMcpUrl" .Values.dashboard.publicMcpUrl | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-dashboard
spec:
  replicas: 1
  selector:
    matchLabels: {app: urumi-dashboard}
  template:
    metadata:
      annotations:
        checksum/public-config: {{ dict "publicMcpUrl" .Values.dashboard.publicMcpUrl | toJson | sha256sum | quote }}
      labels: {app: urumi-dashboard}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - name: public-config
              mountPath: /usr/share/nginx/html/runtime-config.json
              subPath: runtime-config.json
              readOnly: true
      volumes:
        - name: public-config
          configMap:
            name: urumi-dashboard-config
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-dashboard
spec:
  type: ClusterIP
  selector: {app: urumi-dashboard}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: urumi-dashboard
spec:
  podSelector:
    matchLabels: {app: urumi-dashboard}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
      ports:
        - {protocol: TCP, port: 8080}
  egress: []
{{- end }}
{{- end }}
