{{- if and .Values.ingress.enabled .Values.ingress.wordpress.enabled .Values.wordpress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: urumi-wordpress

spec:
  ingressClassName: {{ .Values.global.ingressClassName | quote }}

  {{- if .Values.ingress.wordpress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.global.storeHost | quote }}]
      secretName: {{ .Values.ingress.wordpress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.global.storeHost | quote }}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: urumi-wordpress
                port:
                  number: 80

{{- end }}