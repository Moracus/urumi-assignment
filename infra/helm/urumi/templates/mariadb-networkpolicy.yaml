{{- if and .Values.networkPolicy.enabled .Values.mariadb.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: urumi-mariadb-ingress

spec:
  podSelector:
    matchLabels:
      app: urumi-mariadb

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: urumi-wordpress

      ports:
        - protocol: TCP
          port: 3306

{{- end }}