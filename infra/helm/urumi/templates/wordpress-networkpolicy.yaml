{{- if and .Values.networkPolicy.enabled .Values.wordpress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: urumi-wordpress-ingress

spec:
  podSelector:
    matchLabels:
      app: urumi-wordpress

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}

        - podSelector:
            matchLabels:
              app: urumi-woocommerce-mcp

      ports:
        - protocol: TCP
          port: 80

{{- end }}