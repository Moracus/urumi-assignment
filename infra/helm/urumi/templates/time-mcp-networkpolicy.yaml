{{- if and .Values.networkPolicy.enabled .Values.timeMcp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: urumi-time-mcp-ingress

spec:
  podSelector:
    matchLabels:
      app: urumi-time-mcp

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: urumi-gateway

      ports:
        - protocol: TCP
          port: {{ .Values.timeMcp.port }}

{{- end }}