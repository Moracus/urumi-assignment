{{- if .Values.gateway.enabled }}
{{- $names := list }}
{{- range .Values.gateway.secretReferences }}
{{- if ne .namespace $.Release.Namespace }}
{{- fail "gateway.secretReferences must use the release namespace" }}
{{- end }}
{{- if or (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)*$" .name)) (gt (len .name) 253) }}
{{- fail "Invalid approved Secret name" }}
{{- end }}
{{- if or (not (regexMatch "^[A-Za-z0-9._-]+$" .key)) (gt (len .key) 253) }}
{{- fail "Invalid approved Secret key" }}
{{- end }}
{{- $names = append $names .name }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: urumi-gateway
  namespace: {{ .Release.Namespace }}
{{- if $names }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: urumi-gateway-secrets
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ toJson (uniq $names) }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: urumi-gateway-secrets
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: urumi-gateway
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: urumi-gateway-secrets
{{- end }}
{{- end }}
