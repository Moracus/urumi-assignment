{{- if .Values.woocommerceMcp.enabled }}
apiVersion: apps/v1
kind: Deployment

metadata:
  name: urumi-woocommerce-mcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: urumi-woocommerce-mcp

  template:
    metadata:
      labels:
        app: urumi-woocommerce-mcp

    spec:
      containers:
        - name: woocommerce-mcp

          image: "{{ .Values.woocommerceMcp.image.repository }}:{{ .Values.woocommerceMcp.image.tag }}"

          imagePullPolicy: {{ .Values.woocommerceMcp.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.woocommerceMcp.port }}

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: {{ .Values.woocommerceMcp.port | quote }}

            - name: HOST
              value: "0.0.0.0"

            - name: MCP_ALLOWED_HOSTS
              value: {{ .Values.woocommerceMcp.allowedHosts | quote }}

            - name: WC_URL
              value: {{ .Values.woocommerceMcp.wordpressUrl | quote }}

            - name: WC_INTERNAL_URL
              value: {{ .Values.woocommerceMcp.wordpressInternalUrl | quote }}

            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woocommerceMcp.secretName }}
                  key: consumer-key

            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.woocommerceMcp.secretName }}
                  key: consumer-secret

          resources:
            {{- toYaml .Values.woocommerceMcp.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: urumi-woocommerce-mcp
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: urumi-woocommerce-mcp
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: urumi-woocommerce-mcp
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

{{- end }}