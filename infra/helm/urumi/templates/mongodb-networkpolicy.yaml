{{- if and .Values.mongodb.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: urumi-mongodb
spec:
  podSelector:
    matchLabels:
      app: urumi-mongodb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: urumi-gateway
      ports:
        - protocol: TCP
          port: 27017
{{- end }}
