{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: urumi-mariadb-pvc
spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: {{ .Values.global.storageClassName | quote }}

  resources:
    requests:
      storage: {{ .Values.mariadb.storage.size }}
{{- end }}