global:
  environment: local
  ingressClassName: nginx
  storageClassName: standard
  dashboardHost: dashboard.localhost
  storeHost: store.localhost
  gatewayHost: gateway.localhost
images:
  gateway: urumi/gateway:dev
  dashboard: urumi/dashboard:dev
mariadb:
  enabled: true

  image:
    repository: mariadb
    tag: "11.4"

  database: wordpress
  username: wordpress

  secretName: urumi-db-secret

  storage:
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
wordpress:
  enabled: true

  image:
    repository: wordpress
    tag: "php8.3-apache"

  database:
    host: urumi-mariadb
    name: wordpress
    user: wordpress
    secretName: urumi-db-secret

  storage:
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

woocommerceMcp:
  enabled: true

  image:
    repository: urumi/woocommerce-mcp
    tag: dev
    pullPolicy: IfNotPresent

  port: 3001

  secretName: urumi-woocommerce-api

  wordpressUrl: http://localhost:8080
  wordpressInternalUrl: http://urumi-wordpress

  allowedHosts: "localhost,127.0.0.1,urumi-woocommerce-mcp,urumi-woocommerce-mcp.urumi.svc.cluster.local"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

calculatorMcp:
  enabled: true

  image:
    repository: urumi/calculator-mcp
    tag: dev
    pullPolicy: IfNotPresent

  port: 3002

  allowedHosts: "localhost,127.0.0.1,urumi-calculator-mcp,urumi-calculator-mcp.urumi.svc.cluster.local"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

timeMcp:
  enabled: true

  image:
    repository: urumi/time-mcp
    tag: dev
    pullPolicy: IfNotPresent

  port: 3003

  allowedHosts: "localhost,127.0.0.1,urumi-time-mcp,urumi-time-mcp.urumi.svc.cluster.local"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
gateway:
  enabled: true

  image:
    repository: urumi/gateway
    tag: dev
    pullPolicy: IfNotPresent

  port: 3000

  secretName: urumi-gateway-auth

  allowedHosts: "localhost,127.0.0.1,urumi-gateway,urumi-gateway.urumi.svc.cluster.local,gateway.localhost"

  upstreams:
    woocommerce: http://urumi-woocommerce-mcp:3001/mcp
    calculator: http://urumi-calculator-mcp:3002/mcp
    time: http://urumi-time-mcp:3003/mcp

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi
ingress:
  enabled: true

  gateway:
    enabled: true

  wordpress:
    enabled: true
# Never put raw credentials in values files.
