global:
  environment: local
  ingressClassName: nginx
  storageClassName: standard
  dashboardHost: dashboard.localhost
  storeHost: store.localhost
  gatewayHost: gateway.localhost
images:
  gateway: urumi/gateway:dev
  dashboard: urumi/dashboard:dev
mariadb:
  enabled: true

  image:
    repository: mariadb
    tag: "11.4"

  database: wordpress
  username: wordpress

  secretName: urumi-db-secret

  storage:
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
wordpress:
  enabled: true

  image:
    repository: wordpress
    tag: "php8.3-apache"

  database:
    host: urumi-mariadb
    name: wordpress
    user: wordpress
    secretName: urumi-db-secret

  storage:
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

woocommerceMcp:
  enabled: true

  image:
    repository: urumi/woocommerce-mcp
    tag: dev
    pullPolicy: IfNotPresent

  port: 3001

  secretName: urumi-woocommerce-api

  wordpressUrl: http://localhost:8080
  wordpressInternalUrl: http://urumi-wordpress

  allowedHosts: "localhost,127.0.0.1,urumi-woocommerce-mcp,urumi-woocommerce-mcp.urumi.svc.cluster.local"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

calculatorMcp:
  enabled: true

  image:
    repository: urumi/calculator-mcp
    tag: dev
    pullPolicy: IfNotPresent

  port: 3002

  allowedHosts: "localhost,127.0.0.1,urumi-calculator-mcp,urumi-calculator-mcp.urumi.svc.cluster.local"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

timeMcp:
  enabled: true

  image:
    repository: urumi/time-mcp
    tag: dev
    pullPolicy: IfNotPresent

  port: 3003

  allowedHosts: "localhost,127.0.0.1,urumi-time-mcp,urumi-time-mcp.urumi.svc.cluster.local"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
gateway:
  chat:
    enabled: true
    provider: openai
    model: gpt-4.1-mini-2025-04-14
    # Existing same-namespace Secret; no raw credentials in values.
    secretName: urumi-chat-provider
    secretKey: api-key

  # Exact key-level application approval; names also generate get-only RBAC.
  secretReferences: []

  destinationPolicy:
    rules: []
    deniedCidrs: []
    allowLoopback: false

  enabled: true
  nodeEnv: production

  dashboard:
    # Exact public origins (scheme, host, port); empty denies all login/logout.
    trustedOrigins: []
    allowHttp: false
    # Exact proxy IP addresses; no wildcard or implicit forwarded-header trust.
    trustedProxies: []

  image:
    repository: urumi/gateway
    tag: dev
    pullPolicy: IfNotPresent

  port: 3000

  secretName: urumi-gateway-auth

  # URI Secret for managed or external transaction-capable MongoDB.
  mongodbSecretName: urumi-identity-storage

  allowedHosts: "localhost,127.0.0.1,urumi-gateway,urumi-gateway.urumi.svc.cluster.local,gateway.localhost,dashboard.localhost"

  upstreams:
    woocommerce: http://urumi-woocommerce-mcp:3001/mcp
    calculator: http://urumi-calculator-mcp:3002/mcp
    time: http://urumi-time-mcp:3003/mcp

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi
ingress:
  enabled: true

  dashboard:
    enabled: true
    tlsSecretName: ""

  gateway:
    enabled: true
    tlsSecretName: ""

  wordpress:
    enabled: true
    tlsSecretName: ""

networkPolicy:
  enabled: true

  ingressNamespace: traefik

  # Gateway egress is isolated whenever networkPolicy.enabled is true.
  gatewayEgress:
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
      # Exact resolver IPs for CNIs matching pre-DNAT or NodeLocal DNS.
      serviceCidrs: []
    # Fail closed until operators supply every replica-set destination.
    mongodb: []
    # Exact API Service/backend IPs; no cluster-wide or node subnet allowance.
    kubernetesApi: []
    # Independent of gateway.destinationPolicy; both approvals are required.
    additionalDestinations: []
    # Site-approved provider IPv4 /32 or expanded IPv6 /128 routes, TCP 443 only.
    # Used only when gateway.chat.enabled; no portable provider IP defaults.
    chatProvider:
      - cidr: 162.159.140.245/32
        ports: [443]
  
# Never put raw credentials in values files.

# Optional single-node replica set. Credentials are pre-provisioned Secrets.
mongodb:
  enabled: false
  image:
    repository: mongo
    tag: "8.0"
    pullPolicy: IfNotPresent
  authSecretName: urumi-mongodb-auth
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Public connection information only; mounted at runtime, never put credentials here.
dashboard:
  enabled: true
  publicMcpUrl: ""
  image:
    repository: urumi/dashboard
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
