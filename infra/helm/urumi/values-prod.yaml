global:
  environment: production
  ingressClassName: traefik
  storageClassName: local-path
  dashboardHost: dashboard.example.com
  storeHost: store.example.com
  gatewayHost: gateway.example.com
# Placeholder hostnames. Supply real production values at deployment time.
gateway:
  allowedHosts: "urumi-gateway,urumi-gateway.urumi.svc.cluster.local,gateway.example.com,dashboard.example.com"
  dashboard:
    trustedOrigins: ["https://dashboard.example.com"]

ingress:
  dashboard:
    tlsSecretName: urumi-dashboard-tls
  gateway:
    tlsSecretName: urumi-gateway-tls
  wordpress:
    tlsSecretName: urumi-store-tls
woocommerceMcp:
  wordpressUrl: https://store.example.com
  wordpressInternalUrl: http://urumi-wordpress
