worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        location = /health/live { access_log off; default_type text/plain; return 200 'ok\n'; }
        # Ingress sends /api to the gateway. Never mask misrouting as SPA success.
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location = /mcp { return 404; }
        location ^~ /mcp/ { return 404; }
        location /assets/ { try_files $uri =404; }
        location / { add_header Cache-Control 'no-store'; try_files $uri $uri/ /index.html; }
    }
}
